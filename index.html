         Without this the browser only discovers it after the JS bundle has
         downloaded and run; preloading starts the fetch alongside the HTML.
         Only the first is preloaded: preloading the second as well took
         bandwidth from the JS bundle on a slow connection and made LCP later
         (measured 29 Oct 2026). The file lives in public/hero/ under a stable
         name for exactly this reason. Keep the path in step with the `hero`
         constant in src/App.tsx. -->
    <link rel="preload" as="image" href="./hero/makmal-01.webp" fetchpriority="high" />

         wanshah07.github.io/favicon.ico and logged a 404 (measured

         with a real icon in public/ when Wan supplies one. -->
    <link rel="icon" href="data:," />
